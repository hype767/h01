<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>휴대용 기기 발전 계보</title>
<style>
:root{--bg:#f4fbf3;--ink:#1f4d36;--line:#3fa56b;--leaf:#a8dcb4;--mute:#5d7f6c}
@media(prefers-color-scheme:dark){:root{--bg:#10231a;--ink:#e3f6e8;--line:#7fe0a3;--leaf:#2c5a43;--mute:#9bc4ac}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Malgun Gothic",sans-serif;line-height:1.6}
header{text-align:center;padding:56px 16px 24px}
h1{font-size:clamp(28px,6vw,46px);margin:0 0 8px}header p{color:var(--mute);margin:0;font-size:18px}
.tl{position:relative;max-width:860px;margin:0 auto;padding:16px 16px 80px}
.tl:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:linear-gradient(var(--line),var(--leaf));transform:translateX(-50%);border-radius:3px}
.item{position:relative;display:flex;align-items:center;gap:28px;margin:44px 0;opacity:0;transform:translateY(30px);transition:.8s}
.item.show{opacity:1;transform:none}
.item:nth-child(even){flex-direction:row-reverse}
.item:before{content:"";position:absolute;left:50%;width:18px;height:18px;border-radius:50%;background:var(--bg);border:3px solid var(--line);transform:translateX(-50%)}
.card,.art{width:calc(50% - 30px)}
.art svg{width:100%;max-width:200px;display:block;margin:auto;overflow:visible}
.art path,.art rect,.art circle,.art line,.art ellipse{fill:none;stroke:var(--line);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.show .art *{animation:draw 2.4s ease forwards}
.show .art :nth-child(2){animation-delay:.3s}.show .art :nth-child(3){animation-delay:.6s}.show .art :nth-child(4){animation-delay:.9s}.show .art :nth-child(5){animation-delay:1.2s}
@keyframes draw{to{stroke-dashoffset:0}}
.yr{font-size:34px;font-weight:800;color:var(--line)}
.card h2{margin:0;font-size:22px}.card p{margin:4px 0 0;color:var(--mute);font-size:16px}
.leaf{display:inline-block;animation:sway 3s ease-in-out infinite;transform-origin:bottom}
@keyframes sway{50%{transform:rotate(12deg)}}
@media(max-width:600px){.tl:before{left:14px}.item,.item:nth-child(even){flex-direction:column;align-items:flex-start;padding-left:40px}.item:before{left:14px}.card,.art{width:100%}.art svg{margin:0;max-width:150px}}
@media(prefers-reduced-motion:reduce){.art *{animation:none!important;stroke-dashoffset:0}.item{opacity:1;transform:none}}
</style></head><body>
<header><h1><span class="leaf">🌿</span> 들고 다니는 기기 이야기</h1><p>손바닥 위 세상이 자라온 70년 · 스크롤해서 만나보세요</p></header>
<main class="tl" id="tl"></main>
<script>
const D=[
[1954,"트랜지스터 라디오","주머니에 쏙 들어가는 작은 라디오예요. 둥근 다이얼을 돌려 듣고 싶은 방송을 찾고, 어디든 들고 다니며 음악과 소식을 들을 수 있었어요.",'<rect x="22" y="30" width="56" height="52" rx="7" pathLength="1"/><line x1="66" y1="30" x2="80" y2="10" pathLength="1"/><circle cx="80" cy="9" r="1.6" pathLength="1"/><rect x="28" y="36" width="44" height="12" rx="2" pathLength="1"/><line x1="33" y1="42" x2="67" y2="42" pathLength="1"/><line x1="50" y1="38" x2="50" y2="46" pathLength="1"/><circle cx="38" cy="64" r="9" pathLength="1"/><circle cx="38" cy="64" r="3" pathLength="1"/><line x1="38" y1="64" x2="42" y2="58" pathLength="1"/><path d="M54 56h16M54 61h16M54 66h16M54 71h16" pathLength="1"/><circle cx="64" cy="77" r="1.8" pathLength="1"/><path d="M8 94c1-8 7-12 14-12-1 8-7 12-14 12z" pathLength="1"/><path d="M92 92c-1-6-5-9-10-9 1 6 5 9 10 9z" pathLength="1"/>'],

[1983,"최초의 휴대전화","1983년에 처음 나온 휴대전화로, 벽돌처럼 크고 길쭉한 몸체에 안테나가 달려 있었어요. 숫자 버튼을 눌러 전화를 걸 수 있었고, 어디서든 통화할 수 있다는 점이 놀라웠어요.",'<rect pathLength="1" x="30" y="22" width="40" height="72" rx="5"/><rect pathLength="1" x="34" y="8" width="32" height="14" rx="3"/><line pathLength="1" x1="38" y1="8" x2="38" y2="2"/><rect pathLength="1" x="36" y="27" width="28" height="11" rx="1.5"/><line pathLength="1" x1="40" y1="32.5" x2="54" y2="32.5"/><rect pathLength="1" x="36" y="43" width="28" height="6" rx="1"/><circle pathLength="1" cx="41" cy="57" r="2.6"/><circle pathLength="1" cx="50" cy="57" r="2.6"/><circle pathLength="1" cx="59" cy="57" r="2.6"/><circle pathLength="1" cx="41" cy="66" r="2.6"/><circle pathLength="1" cx="50" cy="66" r="2.6"/><circle pathLength="1" cx="59" cy="66" r="2.6"/><circle pathLength="1" cx="41" cy="75" r="2.6"/><circle pathLength="1" cx="50" cy="75" r="2.6"/><circle pathLength="1" cx="59" cy="75" r="2.6"/><line pathLength="1" x1="38" y1="86" x2="62" y2="86"/><path pathLength="1" d="M80 96 C80 86 88 80 96 82 C96 91 89 97 80 96 Z M80 96 L90 87"/><path pathLength="1" d="M6 20 C6 12 12 6 20 6 C20 14 14 20 6 20 Z"/>'],
[1989,"게임보이","손에 쏙 들어오는 작은 휴대용 게임기예요. 네모난 작은 화면에 초록빛 그림이 나타나고, 십자 버튼과 둥근 버튼으로 게임을 즐겼어요.",'<rect pathLength="1" x="24" y="6" width="52" height="88" rx="4"/><rect pathLength="1" x="30" y="12" width="40" height="34" rx="2"/><rect pathLength="1" x="37" y="18" width="26" height="22" rx="1"/><circle pathLength="1" cx="33" cy="29" r="1.2"/><path pathLength="1" d="M33 55v12M27 61h12"/><circle pathLength="1" cx="60" cy="66" r="3.4"/><circle pathLength="1" cx="69" cy="59" r="3.4"/><line pathLength="1" x1="39" y1="82" x2="46" y2="79"/><line pathLength="1" x1="49" y1="82" x2="56" y2="79"/><path pathLength="1" d="M56 90q6 0 12-3M60 86v4M64 86v4"/><path pathLength="1" d="M82 20c6-8 12-8 14-4-4 6-9 7-14 4zM82 20l9-3"/><path pathLength="1" d="M6 90c0-8 5-12 12-12-1 8-5 12-12 12zM6 90l8-7"/>'],
[2001,"아이팟","주머니에 쏙 들어가는 작은 음악 재생기예요. 동그란 다이얼을 돌려 노래를 고르고, 이어폰으로 천 곡 가까운 노래를 들을 수 있어요.",'<rect x="30" y="8" width="40" height="72" rx="6" pathLength="1"/><rect x="35" y="13" width="30" height="22" rx="2" pathLength="1"/><line x1="39" y1="20" x2="61" y2="20" pathLength="1"/><line x1="39" y1="26" x2="54" y2="26" pathLength="1"/><circle cx="50" cy="55" r="13" pathLength="1"/><circle cx="50" cy="55" r="5" pathLength="1"/><line x1="43" y1="44" x2="57" y2="44" pathLength="1"/><line x1="39" y1="55" x2="41" y2="55" pathLength="1"/><line x1="59" y1="55" x2="61" y2="55" pathLength="1"/><path d="M44 80 L44 86 Q44 92 38 92 Q30 92 28 86" pathLength="1"/><path d="M56 80 L56 86 Q56 92 62 92 Q70 92 72 86" pathLength="1"/><path d="M8 20 Q14 8 24 12 Q20 22 8 20 Z" pathLength="1"/><path d="M92 90 Q86 78 76 82 Q80 92 92 90 Z" pathLength="1"/>'],
[2007,"스마트폰","손가락으로 화면을 눌러 전화도 걸고 사진도 보고 인터넷도 하는 작은 기계예요. 주머니에 쏙 들어가서 어디서든 쓸 수 있어요.",'<rect x="30" y="8" width="40" height="84" rx="7" pathLength="1"/><rect x="35" y="19" width="30" height="52" rx="2" pathLength="1"/><circle cx="50" cy="81" r="4.5" pathLength="1"/><rect x="45" y="12" width="10" height="2.4" rx="1.2" pathLength="1"/><circle cx="39" cy="13.2" r="1.3" pathLength="1"/><line x1="40" y1="28" x2="60" y2="28" pathLength="1"/><rect x="39" y="33" width="7" height="7" rx="1.5" pathLength="1"/><rect x="48" y="33" width="7" height="7" rx="1.5" pathLength="1"/><rect x="39" y="43" width="7" height="7" rx="1.5" pathLength="1"/><rect x="48" y="43" width="7" height="7" rx="1.5" pathLength="1"/><line x1="40" y1="62" x2="60" y2="62" pathLength="1"/><line x1="70" y1="30" x2="72" y2="30" pathLength="1"/><path d="M8 92 C8 80 16 74 28 76 C26 88 18 94 8 92 Z" pathLength="1"/><path d="M92 10 C92 20 86 26 76 24 C78 14 84 8 92 10 Z" pathLength="1"/>'],
[2010,"태블릿","태블릿은 손가락으로 화면을 만지며 사진을 보고, 글을 읽고, 게임을 할 수 있는 얇고 납작한 기계예요. 들고 다니기 편해서 집 안팎 어디서나 쓸 수 있어요.",'<rect x="18" y="8" width="64" height="84" rx="7" pathLength="1"/><rect x="24" y="16" width="52" height="64" rx="2" pathLength="1"/><circle cx="50" cy="86" r="3" pathLength="1"/><circle cx="50" cy="12" r="1.2" pathLength="1"/><line x1="40" y1="11.5" x2="44" y2="11.5" pathLength="1"/><line x1="56" y1="11.5" x2="60" y2="11.5" pathLength="1"/><rect x="30" y="22" width="14" height="12" rx="2" pathLength="1"/><rect x="48" y="22" width="14" height="12" rx="2" pathLength="1"/><circle cx="37" cy="46" r="6" pathLength="1"/><line x1="48" y1="44" x2="68" y2="44" pathLength="1"/><line x1="48" y1="50" x2="62" y2="50" pathLength="1"/><line x1="30" y1="62" x2="70" y2="62" pathLength="1"/><line x1="30" y1="69" x2="58" y2="69" pathLength="1"/><path d="M82 92 C82 84 90 80 96 82 C96 90 90 94 82 92 Z" pathLength="1"/><path d="M18 8 C18 2 10 2 6 6 C10 12 16 12 18 8 Z" pathLength="1"/>'],
[2015,"스마트워치","손목에 차는 똑똑한 시계예요. 시간을 알려 주고, 걸음 수를 세고, 전화나 문자가 오면 화면으로 알려 줘요.",'<rect x="36" y="4" width="28" height="22" rx="4" pathLength="1"/><rect x="36" y="74" width="28" height="22" rx="4" pathLength="1"/><line x1="40" y1="12" x2="60" y2="12" pathLength="1"/><line x1="40" y1="88" x2="60" y2="88" pathLength="1"/><rect x="28" y="24" width="44" height="52" rx="12" pathLength="1"/><rect x="33" y="29" width="34" height="42" rx="8" pathLength="1"/><circle cx="50" cy="50" r="13" pathLength="1"/><line x1="50" y1="50" x2="50" y2="41" pathLength="1"/><line x1="50" y1="50" x2="57" y2="53" pathLength="1"/><line x1="50" y1="34" x2="50" y2="37" pathLength="1"/><rect x="72" y="40" width="5" height="9" rx="2" pathLength="1"/><line x1="72" y1="58" x2="76" y2="58" pathLength="1"/><path d="M8 94 C8 84 16 78 24 80 C22 88 16 94 8 94 Z" pathLength="1"/><path d="M92 8 C92 16 86 22 78 20 C80 12 85 8 92 8 Z" pathLength="1"/>'],
[2020,"접는 폰과 스마트 안경","가운데를 책처럼 접었다 펼 수 있는 휴대폰과, 눈앞에 글자와 그림을 띄워 주는 안경이에요. 주머니에는 쏙 들어가고, 펼치면 큰 화면으로 볼 수 있어요.",'<rect pathLength="1" x="8" y="12" width="36" height="52" rx="4"/><line pathLength="1" x1="26" y1="12" x2="26" y2="64"/><rect pathLength="1" x="12" y="17" width="10" height="42" rx="2"/><rect pathLength="1" x="30" y="17" width="10" height="42" rx="2"/><circle pathLength="1" cx="17" cy="22" r="1.4"/><line pathLength="1" x1="35" y1="62" x2="41" y2="62"/><line pathLength="1" x1="44" y1="28" x2="44" y2="36"/><circle pathLength="1" cx="62" cy="62" r="9"/><circle pathLength="1" cx="84" cy="62" r="9"/><path pathLength="1" d="M71 61 Q73 57 75 61"/><path pathLength="1" d="M53 61 L48 58 M93 61 L97 58"/><line pathLength="1" x1="58" y1="55" x2="66" y2="55"/><circle pathLength="1" cx="84" cy="62" r="3.5"/><path pathLength="1" d="M6 94 Q8 84 18 82 Q18 92 6 94 Z"/><path pathLength="1" d="M94 8 Q92 18 82 20 Q82 10 94 8 Z"/>']
];
const tl=document.getElementById("tl");
D.forEach(([y,t,p,s])=>{const e=document.createElement("div");e.className="item";
e.innerHTML=`<div class="art"><svg viewBox="0 0 100 100">${s.replace(/<(\w+) /g,'<$1 pathLength="1" ')}</svg></div><div class="card"><div class="yr">${y}</div><h2>${t}</h2><p>${p}</p></div>`;tl.appendChild(e)});
const io=new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting&&x.target.classList.add("show")),{threshold:.3});
document.querySelectorAll(".item").forEach(i=>io.observe(i));
</script></body></html>
